name: Stock V4 Manual Deploy

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: main 分支上已成功完成的验收构建 Run ID
        required: true
        type: string
      approval_confirmed:
        description: 仅核准镜像摘要清单；维护窗口和数据库检查由生产 release.sh 执行
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-v4-production-release
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm the release request
        shell: bash
        env:
          APPROVAL_CONFIRMED: ${{ inputs.approval_confirmed }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$APPROVAL_CONFIRMED" != true ]]; then
            echo "::error::Run from main and confirm approval of the image digest manifest."
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Verify the selected build and approve its digest manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter the numeric run ID of a successful main build."
            exit 1
          fi
          release="$RUNNER_TEMP/stock-v4-release"
          mkdir -p "$release/source" "$release/approved"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$release/build.json"
          attempt="$(python3 -B tools/verify_release.py "$release/build.json" "$GITHUB_REPOSITORY" "$BUILD_RUN_ID")"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "stock-v4-release-$BUILD_RUN_ID-$attempt" --dir "$release/source"
          python3 -B tools/verify_release.py "$release/build.json" "$GITHUB_REPOSITORY" "$BUILD_RUN_ID" \
            --manifest "$release/source/release.env" > "$release/approved/release.env"
          {
            printf 'Approved [build run %s, attempt %s](%s/%s/actions/runs/%s)\n\n' \
              "$BUILD_RUN_ID" "$attempt" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN_ID"
            printf 'Download the approved artifact and apply its release.env on the production host with deploy/release.sh.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: stock-v4-approved-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stock-v4-release/approved/release.env
          if-no-files-found: error
          retention-days: 30
