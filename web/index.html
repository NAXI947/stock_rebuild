<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Stocknew · 股票研究</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/template-layout.css">
  <link rel="stylesheet" href="/data-updates.css">
  <script src="/template-layout.js" defer></script>
  <script src="/data-updates.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="shell research-shell">
  <header class="shell-top">
    <div class="shell-top-inner">
      <button class="shell-mobile-toggle" id="shell-menu" type="button" aria-controls="workspace-navigation" aria-expanded="false">菜单</button>
      <button class="shell-desktop-toggle" id="shell-collapse" type="button" aria-controls="workspace-navigation" aria-expanded="true">收起导航</button>
      <div class="shell-brand">Stocknew<span id="shell-module-name">个人研究</span></div>
      <nav class="shell-module-switch" aria-label="模块切换">
        <button type="button" data-module="research" class="active" aria-pressed="true">股票研究</button>
        <button type="button" data-module="admin" aria-pressed="false">系统管理</button>
      </nav>
      <div class="shell-top-right">
        <span id="freshness" class="shell-freshness timestamp"></span>
        <span class="shell-session"><span class="dot" id="shell-session-dot" aria-hidden="true"></span><span id="shell-session-label">研究会话未连接</span></span>
        <button class="shell-logout" type="button" id="logout" hidden><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10" /></svg>退出会话</button>
      </div>
    </div>
  </header>
  <div class="shell-body">
    <button class="shell-drawer-backdrop" id="shell-backdrop" type="button" aria-label="关闭菜单" tabindex="-1"></button>
    <aside id="workspace-navigation" class="shell-side">
      <div class="shell-side-title"><span id="shell-side-label">股票研究</span><button type="button" class="shell-side-close" id="shell-close">关闭</button></div>
      <nav class="shell-nav" id="research-navigation" aria-label="研究导航">
          <button type="button" data-page="overview" aria-current="page"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-10M15 5h5v5M3 21h18" /></svg><span>轮动与机会</span></button>
          <button type="button" data-page="market"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v14H3zM7 21h10M12 18v3M6 13l4-4 4 3 4-6" /></svg><span>大盘全景</span></button>
          <button type="button" data-page="sector-etf"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10" /></svg><span>板块与 ETF</span></button>
          <button type="button" data-page="left-right"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5" /></svg><span>LEFT / RIGHT</span></button>
          <button type="button" data-page="hot-sectors"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9l7 4M9 3.5a9 9 0 1 0 6-.1" /></svg><span>热门板块</span></button>
          <button type="button" data-page="backtest"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4v17h16V4h-4M8 3h8v4H8zM8 11h8M8 15h6" /></svg><span>回测工作台</span></button>
          <button type="button" data-page="trades"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4m0 16h16M8 16v-5m5 5V7m5 9v-9" /></svg><span>实盘记账</span></button>
      </nav>
      <nav class="shell-nav" id="admin-navigation" aria-label="管理导航" hidden>
        <p class="shell-nav-group">数据与采集</p>
          <button type="button" data-page="data-updates"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5M20 20v-5h-5M5.5 9A7 7 0 0 1 18 7.5M18.5 15A7 7 0 0 1 6 16.5" /></svg><span>数据更新与补采</span></button>
          <button type="button" data-page="status"><svg class="picks-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg><span>运行状态</span></button>
      </nav>
      <div class="shell-note shell-environment"><span id="environment">调测工作台</span></div>
    </aside>
    <main class="shell-main">
      <section id="login" class="login-panel">
        <h1>进入研究工作台</h1>
        <form id="login-form" class="stack">
          <label>访问令牌<input type="password" id="token" name="token" required autocomplete="off" spellcheck="false"></label>
          <button class="primary" type="submit">打开工作台</button>
          <p class="message" id="login-status" role="status"></p>
        </form>
      </section>
      <div id="workspace" hidden>
        <div id="message" class="message" role="status" hidden></div>
        <section id="screen" aria-live="polite"></section>
      </div>
    </main>
  </div>
</body>
</html>
