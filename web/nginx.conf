worker_processes 1;
pid /app/tmp/web/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /app/tmp/web/client_body;
    proxy_temp_path /app/tmp/web/proxy;
    fastcgi_temp_path /app/tmp/web/fastcgi;
    uwsgi_temp_path /app/tmp/web/uwsgi;
    scgi_temp_path /app/tmp/web/scgi;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    # Body buffering is bounded by the existing API limit and avoids temp files.
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    limit_conn_zone $server_name zone=workspace:64k;

    server {
        listen 8080;
        limit_conn workspace 8;
        root /app/web;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend stock-v4-backend:8000;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control no-store always;

        location = / { try_files /index.html =404; }
        location = /favicon.ico { return 204; }
        location = /app.js { try_files $uri =404; }
        location = /style.css { try_files $uri =404; }
        location = /data-updates.js { try_files $uri =404; }
        location = /data-updates.css { try_files $uri =404; }
        location = /template-layout.js { try_files $uri =404; }
        location = /template-layout.css { try_files $uri =404; }
        location / { return 404; }

        location = /api/v2/market/ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 45s;
            proxy_pass http://$backend;
        }

        location ~ ^/(health$|api/v2/) {
            proxy_connect_timeout 3s;
            proxy_send_timeout 25s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host $host;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_buffering off;
            proxy_pass http://$backend;
        }
    }
}
